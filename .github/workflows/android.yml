name: Android app

# Builds the ShapeCoach Android App Bundle (a Trusted Web Activity around the website).
# The bundle is built unsigned: the upload key never lives in this public repository.
# Sign it locally before uploading to Play Console (see docs/PLAY_STORE.md).

on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners come with the Android SDK; add the API 36 platform to it.
      - name: Install Android 16 (API 36) platform and build tools
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build the unsigned release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: shapecoach-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish the bundle to the android-build branch
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab out/shapecoach-unsigned.aab
          cd out
          printf 'Unsigned ShapeCoach release bundle\nSource commit: %s\nBranch: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > BUILD.txt
          git init -q -b android-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Unsigned release bundle built from $GITHUB_SHA"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-build
